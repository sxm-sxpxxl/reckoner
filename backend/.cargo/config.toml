[env]
# Интеграционные тесты ходят в Neon, и каждый поднимает собственный пул: общего
# на бинарник быть не может, потому что каждый `#[tokio::test]` запускает свой
# рантайм, а соединения живут в том рантайме, где созданы.
#
# По умолчанию харнесс берёт параллелизм по числу ядер (здесь 20), то есть
# открывает до сорока TLS-соединений разом. Бесплатный compute Neon такой шквал
# отвергает, и тесты падают вразнобой — `PoolTimedOut` на самом подключении
# и `peer closed connection without sending TLS close_notify` — без всякой связи
# с проверяемой логикой.
#
# Четыре потока по два соединения — восемь подключений вместо сорока.
#
# Полностью падения это не убирает: бесплатный compute Neon — 0.25 CU, один
# round-trip до него измерен в ~500 мс, и под нагрузкой он рвёт соединения
# (`peer closed connection without sending TLS close_notify`). Серийный прогон
# (`RUST_TEST_THREADS = "1"`) тоже падал, но уже за 84 секунды вместо 11, так
# что от него толку нет.
#
# Юнит-тесты домена от этого не страдают: они в память и занимают сотые доли
# секунды все вместе.
# Один поток. Шли от 20 (по числу ядер) через 4 и 2 — на каждом шаге прогон
# падал вразнобой, каждый раз в других тестах: сначала `ConnectionReset`
# на миграциях, потом `PoolTimedOut` на открытии транзакции, потом
# `peer closed connection without sending TLS close_notify` уже посреди
# запроса. Последнее не лечится ни таймаутом (соединение закрыто, а не
# медленно), ни повтором подключения (рвётся установленное).
#
# Причина одна: бесплатный compute Neon — 0.25 CU, и несколько одновременных
# соединений он не держит. Значит единственный надёжный рычаг — не открывать
# их одновременно.
#
# Цена — время: прогон интеграционных тестов идёт минуты, потому что каждый
# запрос это round-trip до Франкфурта (~500 мс). Юнит-тесты домена от этого
# не страдают: они в память и занимают сотые доли секунды все вместе, поэтому
# быстрая обратная связь по расчётам сохраняется.
#
# ЧЕСТНО ПРО ОСТАТОК: полностью это не вылечено, и вылечить со стороны клиента
# нельзя. Сделано три вещи (см. tests/support/mod.rs): миграции однократно
# на процесс, повтор подключения и повтор открытия транзакции — то есть всё,
# где повтор безопасен, потому что работа ещё не началась. После них отказы
# ушли с «двух-трёх за прогон» до «примерно одного на 49 тестов», и остаток
# приходится на обрыв уже установленного соединения посреди запроса. Там
# повторять нельзя: в транзакции есть состояние, и повторённый тест проверял бы
# не то, что задумано.
#
# Красный прогон с текстом `close_notify` / `PoolTimedOut` / `ConnectionReset`
# надо просто перезапустить. Признак инфраструктуры, а не кода — то, что имя
# падающего теста каждый раз другое. Если один и тот же тест падает дважды
# подряд, вот это уже повод искать регрессию.
RUST_TEST_THREADS = "1"
