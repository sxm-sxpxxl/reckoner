[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate", "macros"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[dev-dependencies]
proptest = "1.11.0"
