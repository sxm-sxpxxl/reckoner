name: CI

on:
  push:
    branches: [master]
  pull_request:

# Новый пуш отменяет проверку предыдущего коммита той же ветки: досматривать
# результат по устаревшему коду незачем.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Форматирование
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Только `--lib`: интеграционные тесты ходят в бранч `test` в Neon.
      # Класть строку подключения в секреты ради них — лишний риск и лишняя
      # связность; домен и слой API проверяются здесь полностью и без сети.
      - name: Тесты без базы
        run: cargo test --lib

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Типы
        run: npx tsc -b

      - name: Линтер
        run: npm run lint

      - name: Тесты
        run: npm test

      - name: Сборка
        run: npm run build
